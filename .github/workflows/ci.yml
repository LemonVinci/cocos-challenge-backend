name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify
        run: ./mvnw -B verify

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            python3 - << 'PY'
          import csv
          from pathlib import Path
          report = Path("target/site/jacoco/jacoco.csv")
          if not report.exists():
              print("JaCoCo report was not generated.")
              raise SystemExit(0)
          missed = covered = 0
          with report.open() as handle:
              for row in csv.DictReader(handle):
                  if row["CLASS"] == "CocosChallengeApplication":
                      continue
                  missed += int(row["LINE_MISSED"])
                  covered += int(row["LINE_COVERED"])
          total = missed + covered
          if total == 0:
              print("No domain classes to measure yet. The bootstrap class is excluded.")
          else:
              print(f"Line coverage: {covered / total:.1%} ({covered}/{total}). Minimum is 60%.")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
