name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify
        run: ./mvnw -B verify

      - name: Publish coverage summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - << 'PY' | tee coverage.txt
          import csv
          from pathlib import Path
          report = Path("target/site/jacoco/jacoco.csv")
          if not report.exists():
              print("JaCoCo report was not generated.")
              raise SystemExit(0)
          missed = covered = 0
          with report.open() as handle:
              for row in csv.DictReader(handle):
                  if row["CLASS"] == "CocosChallengeApplication":
                      continue
                  missed += int(row["LINE_MISSED"])
                  covered += int(row["LINE_COVERED"])
          total = missed + covered
          if total == 0:
              print("No domain classes to measure yet. The bootstrap class is excluded.")
          else:
              print(f"Line coverage: {covered / total:.1%} ({covered}/{total}). Minimum is 60%.")
          PY
          {
            echo "## Coverage"
            cat coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ ! -s coverage.txt ]; then
            exit 0
          fi
          body="$(printf '<!-- cocos-coverage -->\n%s\n' "$(cat coverage.txt)")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- cocos-coverage -->")) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body"
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
